# AI Edu Platform 三服务一键部署 (demo, 2-3 人)
# 前置: 三个仓库为兄弟目录(同一父目录下):
#   ../                = aiEduPlatform (后端, 含本 deploy/)
#   ../../aiEduPlatformModel/ai-edu-ai-service  = Python AI 服务
#   ../../aiEduPlatformFront/ai-edu-front        = 前端
# 用法: cd deploy && cp .env.example .env(填 Python 密钥) && docker compose up -d --build
services:
  backend:
    build:
      context: ../
      dockerfile: deploy/backend.Dockerfile
    container_name: ai-edu-backend
    ports:
      - "9627:9627"
    environment:
      # Docker 内 Java 连 Python 用 compose 服务名(替代 application.yml 里的 127.0.0.1:9527)
      - LLM_GATEWAY_BASEURL=http://ai-service:9527
    restart: unless-stopped
    networks: [ai-edu]
    depends_on:
      - ai-service

  ai-service:
    build:
      context: ../../aiEduPlatformModel/ai-edu-ai-service
      dockerfile: Dockerfile
    container_name: ai-edu-ai-service
    env_file: .env          # Python 密钥: DOUBAO_API_KEY / DASHSCOPE_API_KEY / COS_VECTORS_* / INTERNAL_TOKEN
    ports:
      - "9527:9527"
    restart: unless-stopped
    networks: [ai-edu]

  frontend:
    build:
      context: ../../aiEduPlatformFront/ai-edu-front
      dockerfile: Dockerfile
    container_name: ai-edu-front
    ports:
      - "80:80"
    restart: unless-stopped
    networks: [ai-edu]
    depends_on:
      - backend

networks:
  ai-edu:
    driver: bridge
